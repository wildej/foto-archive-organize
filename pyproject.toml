[project]
name = "photoarchive"
version = "0.1.0"
description = "Сведение компьютерного архива и Google Photos в одну раскладку год/месяц/альбом"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow>=10.4.0",
  "imagehash>=4.3.1",
  "exifread>=3.0.0",
]

[project.optional-dependencies]
raw = ["rawpy>=0.21"]
heic = ["pillow-heif>=0.16"]
dev = ["pytest>=8.0"]

[project.scripts]
photoarchive = "photoarchive.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
